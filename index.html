<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1: How is music a part of our lives?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Inter:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #09090b; /* Zinc 950 */
            color: white; 
            overflow-x: hidden;
        }
        
        h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; }

        .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Dynamic Equalizer Background */
        .equalizer-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        
        .bar {
            width: 4%;
            background: linear-gradient(to top, #8b5cf6, #ec4899);
            border-radius: 4px 4px 0 0;
            animation: bounce 1.5s infinite ease-in-out alternate;
        }
        
        .bar:nth-child(odd) { animation-duration: 1.2s; background: linear-gradient(to top, #3b82f6, #8b5cf6); }
        .bar:nth-child(3n) { animation-duration: 1.8s; background: linear-gradient(to top, #06b6d4, #3b82f6); }
        .bar:nth-child(1) { height: 40%; } .bar:nth-child(2) { height: 80%; }
        .bar:nth-child(3) { height: 60%; } .bar:nth-child(4) { height: 100%; }
        .bar:nth-child(5) { height: 30%; } .bar:nth-child(6) { height: 70%; }
        .bar:nth-child(7) { height: 50%; } .bar:nth-child(8) { height: 90%; }
        .bar:nth-child(9) { height: 40%; } .bar:nth-child(10) { height: 80%; }
        
        @keyframes bounce {
            0% { transform: scaleY(0.3); transform-origin: bottom; }
            100% { transform: scaleY(1); transform-origin: bottom; }
        }

        /* Vinyl Record Spin */
        .spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }
    </style>
</head>
<body>
    <div class="equalizer-bg">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
    </div>
    
    <div id="root" class="relative z-10 min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ScratchCard = ({ artist }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [revealed, setRevealed] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                // Draw the initial scratch-off layer
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#4c1d95'); // Violet
                gradient.addColorStop(1, '#db2777'); // Pink
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Add text pattern over the cover
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.font = 'bold 24px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText('SCRATCH ME', canvas.width / 2, canvas.height / 2 + 8);
            }, []);

            const startDrawing = (e) => {
                setIsDrawing(true);
                scratch(e);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const scratch = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                
                // Support both touch and mouse
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                // Scale coordinates relative to CSS size vs internal Canvas resolution
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                // Erase the layer
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 35, 0, Math.PI * 2);
                ctx.fill();
            };

            return (
                <div className="relative w-full max-w-sm h-80 mx-auto rounded-2xl overflow-hidden shadow-[0_0_20px_rgba(219,39,119,0.3)] border border-zinc-700">
                    {/* Hidden Content Underneath */}
                    <div className="absolute inset-0 bg-black flex flex-col items-center justify-center p-4 text-center">
                        <img 
                            src={artist.imageUrl} 
                            alt={artist.name}
                            onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/200x200/27272a/ec4899?text=${artist.name.charAt(0)}` }}
                            className="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover mb-3 border-4 border-violet-500 shadow-[0_0_25px_rgba(139,92,246,0.6)] bg-zinc-800"
                        />
                        <h3 className="text-xl md:text-2xl font-display font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-violet-400 mb-1">{artist.name}</h3>
                        <p className="text-xs text-zinc-300 font-medium leading-snug">{artist.fact}</p>
                    </div>
                    
                    {/* Scratchable Canvas Layer */}
                    <canvas 
                        ref={canvasRef}
                        width={400}
                        height={320}
                        className={`absolute inset-0 w-full h-full cursor-crosshair transition-opacity duration-1000 ${revealed ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                        onMouseDown={startDrawing}
                        onMouseUp={stopDrawing}
                        onMouseLeave={stopDrawing}
                        onMouseMove={scratch}
                        onTouchStart={startDrawing}
                        onTouchEnd={stopDrawing}
                        onTouchMove={scratch}
                    />
                    
                    {/* Auto-Reveal Fallback Button */}
                    {!revealed && (
                        <button 
                            onClick={() => setRevealed(true)}
                            className="absolute bottom-3 right-3 bg-zinc-900/80 text-pink-400 font-bold text-xs px-4 py-2 rounded-full hover:bg-zinc-800 border border-pink-500/30 backdrop-blur-sm transition"
                        >
                            Reveal Name
                        </button>
                    )}
                </div>
            );
        };

        const artistsData = [
            {
                id: 1,
                clue: "In 2018, over two million fans attended her live concerts in the USA alone.",
                name: "Taylor Swift",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b1/Taylor_Swift_at_the_2023_MTV_Video_Music_Awards_%283%29.png",
                fact: "We'll read about her touring success on Page 5!"
            },
            {
                id: 2,
                clue: "He made a staggering $432 million from music tours worldwide in a single year.",
                name: "Ed Sheeran",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/c/c1/Ed_Sheeran-6886_%28cropped%29.jpg",
                fact: "Live music and touring is becoming the future of the industry (Page 5)."
            },
            {
                id: 3,
                clue: "His 5th Symphony was sent into outer space on the Voyager 1 probe in 1977.",
                name: "Beethoven",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Beethoven.jpg",
                fact: "His music was chosen to represent Earth to aliens (Page 7)!"
            },
            {
                id: 4,
                clue: "His 1950s rock song 'Johnny B. Goode' was also included on the Golden Record sent into space.",
                name: "Chuck Berry",
                imageUrl: "https://hips.hearstapps.com/hmg-prod/images/gettyimages-74254327.jpg",
                fact: "The Voyager 1 Golden Record features his iconic guitar riff!"
            },
            {
                id: 5,
                clue: "A child prodigy who started composing at age five, he is one of the most famous classical musicians ever.",
                name: "W. A. Mozart",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Wolfgang-amadeus-mozart_1.jpg",
                fact: "Classical music has been shown to lower heart rates and reduce stress."
            },
            {
                id: 6,
                clue: "She recorded her Grammy-winning debut album entirely in her brother's small bedroom.",
                name: "Billie Eilish",
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/f/fa/Billie_Eilish_2019_by_Glenn_Francis_%28cropped%29_2.jpg",
                fact: "She represents the new trend of 'bedroom pop' enabled by modern digital tech!"
            }
        ];

        const quizData = [
            {
                id: 1,
                q: "In music, an 'earworm' is a song:",
                options: [
                    { text: "with memorable lyrics.", isCorrect: false },
                    { text: "that repeats itself in your head.", isCorrect: true },
                    { text: "with a fast tempo.", isCorrect: false }
                ],
                fact: "An earworm is a catchy piece of music that continually repeats through a person's mind."
            },
            {
                id: 2,
                q: "The maximum number of tracks a music app can have is:",
                options: [
                    { text: "30 million.", isCorrect: true },
                    { text: "13 million.", isCorrect: false },
                    { text: "3 million.", isCorrect: false }
                ],
                fact: "Many major streaming apps initially capped at around 30 million tracks (though they have grown since!)."
            },
            {
                id: 3,
                q: "Music influences our circadian rhythm, which is:",
                options: [
                    { text: "how we move.", isCorrect: false },
                    { text: "how we feel.", isCorrect: false },
                    { text: "the times when we sleep and eat.", isCorrect: true }
                ],
                fact: "Our circadian rhythms are our physical, mental, and behavioral changes that follow a 24-hour cycle."
            },
            {
                id: 4,
                q: "Shopping malls and stores use playlists or background music to:",
                options: [
                    { text: "entertain us.", isCorrect: false },
                    { text: "make us stay longer.", isCorrect: true },
                    { text: "encourage us to shop quickly.", isCorrect: false }
                ],
                fact: "Slow-tempo music makes shoppers walk slower, meaning they spend more time and money in the store!"
            },
            {
                id: 5,
                q: "Research suggests that we associate notes with a higher pitch with:",
                options: [
                    { text: "bitter flavors.", isCorrect: false },
                    { text: "salty flavors.", isCorrect: false },
                    { text: "sweet flavors.", isCorrect: true }
                ],
                fact: "Cross-modal perception shows our brains link high pitch to sweetness, and low pitch to bitterness."
            },
            {
                id: 6,
                q: "The genres and melodies we like throughout our life are usually from:",
                options: [
                    { text: "our childhood.", isCorrect: false },
                    { text: "our teenage years.", isCorrect: true },
                    { text: "our adult years.", isCorrect: false }
                ],
                fact: "Musical nostalgia is strongest for the music we listened to between ages 13 and 16."
            }
        ];

        const App = () => {
            const [stage, setStage] = useState(0); 
            const [answers, setAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            const handleSelect = (qId, optIndex) => {
                if (quizSubmitted) return;
                setAnswers({ ...answers, [qId]: optIndex });
            };

            const submitQuiz = () => {
                setQuizSubmitted(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const nextStage = () => {
                setStage(stage + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (stage === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="max-w-4xl mx-auto fade-in">
                            <div className="mb-6 inline-block">
                                <i className="fas fa-headphones-alt text-6xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500"></i>
                            </div>
                            <h3 className="text-sm font-bold tracking-[0.3em] uppercase text-violet-400 mb-4">Unit 1 Introduction</h3>
                            <h1 className="font-display text-6xl md:text-8xl font-black mb-6 text-white leading-tight">
                                How is <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">MUSIC</span><br/> a part of our lives?
                            </h1>
                            <p className="text-2xl text-zinc-400 mb-12 font-light max-w-2xl mx-auto">
                                Before we watch the Factflix video, let's test your instincts. What does music actually do to your brain?
                            </p>
                            <button 
                                onClick={nextStage}
                                className="group relative inline-flex items-center justify-center px-10 py-5 font-bold text-white transition-all duration-200 bg-zinc-900 border-2 border-violet-500 rounded-full hover:bg-violet-600 focus:outline-none shadow-[0_0_30px_rgba(139,92,246,0.3)] hover:shadow-[0_0_40px_rgba(139,92,246,0.6)] hover:-translate-y-1"
                            >
                                <span className="mr-3 text-xl tracking-wider font-display uppercase">Start the Quiz</span>
                                <i className="fas fa-play transform group-hover:scale-110 transition-transform text-pink-400 group-hover:text-white"></i>
                            </button>
                        </div>
                    </div>
                );
            }

            if (stage === 1) {
                return (
                    <div className="min-h-screen p-6 md:p-12 pb-24">
                        <div className="max-w-5xl mx-auto fade-in">
                            <header className="flex justify-between items-end mb-10 border-b border-zinc-800 pb-6">
                                <div>
                                    <h2 className="text-4xl font-display font-black text-white">The Music in Our Lives</h2>
                                    <p className="text-zinc-400 mt-2 text-lg">Activity 2: Work in pairs to do the quiz. Which questions are hard to answer?</p>
                                </div>
                                <div className="hidden md:block">
                                    <span className="bg-violet-900/50 text-violet-300 py-1 px-4 rounded-full text-sm font-bold border border-violet-500/30">Phase 1 of 3</span>
                                </div>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 slide-up">
                                {quizData.map((q, qIndex) => (
                                    <div key={q.id} className="bg-zinc-900/80 border border-zinc-800 p-6 rounded-2xl shadow-xl hover:border-zinc-700 transition-colors">
                                        <p className="text-xl font-medium text-white mb-6">
                                            <span className="text-pink-500 font-black mr-2">{q.id}.</span> {q.q}
                                        </p>
                                        <div className="space-y-3">
                                            {q.options.map((opt, oIndex) => {
                                                const isSelected = answers[q.id] === oIndex;
                                                let btnClass = "w-full text-left p-4 rounded-xl border transition-all duration-200 font-medium ";
                                                
                                                if (quizSubmitted) {
                                                    if (opt.isCorrect) {
                                                        btnClass += "bg-emerald-900/40 border-emerald-500 text-emerald-300";
                                                    } else if (isSelected && !opt.isCorrect) {
                                                        btnClass += "bg-rose-900/40 border-rose-500 text-rose-300 opacity-60";
                                                    } else {
                                                        btnClass += "bg-zinc-900/50 border-zinc-800 text-zinc-500 opacity-50";
                                                    }
                                                } else {
                                                    btnClass += isSelected 
                                                        ? "bg-violet-900/60 border-violet-400 text-white shadow-[0_0_15px_rgba(139,92,246,0.3)] transform scale-[1.02]" 
                                                        : "bg-zinc-800/50 border-zinc-700 text-zinc-300 hover:bg-zinc-800 hover:border-zinc-500";
                                                }

                                                return (
                                                    <button 
                                                        key={oIndex}
                                                        onClick={() => handleSelect(q.id, oIndex)}
                                                        disabled={quizSubmitted}
                                                        className={btnClass}
                                                    >
                                                        <span className="inline-block w-6 font-bold opacity-50">{['a', 'b', 'c'][oIndex]})</span> {opt.text}
                                                        {quizSubmitted && opt.isCorrect && <i className="fas fa-check-circle float-right mt-1 text-emerald-400"></i>}
                                                        {quizSubmitted && isSelected && !opt.isCorrect && <i className="fas fa-times-circle float-right mt-1 text-rose-400"></i>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        
                                        {quizSubmitted && (
                                            <div className="mt-6 p-4 bg-black/50 rounded-lg border-l-4 border-indigo-500 animate-fade-in text-sm text-zinc-300">
                                                <i className="fas fa-info-circle text-indigo-400 mr-2"></i>
                                                <span className="font-semibold text-white">Factflix says:</span> {q.fact}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="mt-12 text-center slide-up delay-2">
                                {!quizSubmitted ? (
                                    <button 
                                        onClick={submitQuiz}
                                        disabled={Object.keys(answers).length < quizData.length}
                                        className={`px-12 py-4 rounded-full font-bold text-lg transition-all ${
                                            Object.keys(answers).length === quizData.length
                                            ? 'bg-pink-600 hover:bg-pink-500 text-white shadow-[0_0_20px_rgba(219,39,119,0.5)]'
                                            : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                                        }`}
                                    >
                                        Reveal Factflix Answers
                                    </button>
                                ) : (
                                    <button 
                                        onClick={nextStage}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-12 py-4 rounded-full font-bold text-lg shadow-[0_0_20px_rgba(79,70,229,0.5)] transition-all transform hover:scale-105"
                                    >
                                        Continue to Video Discussion <i className="fas fa-arrow-right ml-2"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 2) {
                return (
                    <div className="min-h-screen p-6 md:p-12 flex items-center">
                        <div className="max-w-6xl mx-auto w-full fade-in">
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                {/* Left Column: Video Simulation */}
                                <div className="order-2 lg:order-1 slide-up">
                                    <div className="relative rounded-2xl overflow-hidden shadow-2xl border border-zinc-700 bg-black aspect-video flex flex-col items-center justify-center group cursor-pointer">
                                        <div className="absolute inset-0 bg-gradient-to-tr from-indigo-900/40 to-pink-900/40 mix-blend-overlay"></div>
                                        <i className="fas fa-play-circle text-7xl text-white opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all z-10 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]"></i>
                                        <p className="absolute bottom-6 left-6 font-display font-bold text-2xl z-10"><span className="text-red-500">FACT</span>FLIX: Music in Daily Life</p>
                                    </div>
                                    
                                    <div className="mt-8 bg-zinc-900 p-6 rounded-xl border border-zinc-800">
                                        <h4 className="text-pink-400 font-bold uppercase tracking-widest text-sm mb-3"><i className="fas fa-search mr-2"></i>Video Task</h4>
                                        <p className="text-lg text-white font-medium">How many hours does the average teenager listen to music each day? <span className="text-zinc-400 italic font-normal">What about you?</span></p>
                                    </div>
                                </div>

                                {/* Right Column: Speaking Task & Key Phrases */}
                                <div className="order-1 lg:order-2 slide-up delay-1">
                                    <h2 className="text-4xl font-display font-black mb-6">Let's Discuss</h2>
                                    
                                    <div className="space-y-4 mb-10">
                                        <div className="bg-zinc-800/50 p-4 rounded-lg border-l-4 border-indigo-500">
                                            <p className="text-white">1. What music do you usually listen to? What genres / artists?</p>
                                        </div>
                                        <div className="bg-zinc-800/50 p-4 rounded-lg border-l-4 border-indigo-500">
                                            <p className="text-white">2. Where and when do you listen to it?</p>
                                        </div>
                                        <div className="bg-zinc-800/50 p-4 rounded-lg border-l-4 border-indigo-500">
                                            <p className="text-white">3. What impact does the music have on you?</p>
                                        </div>
                                        <div className="bg-zinc-800/50 p-4 rounded-lg border-l-4 border-indigo-500">
                                            <p className="text-white">4. Do you think you will listen to the same music in five years' time?</p>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-violet-900/40 to-black p-6 rounded-2xl border border-violet-500/30">
                                        <h4 className="text-violet-300 font-bold uppercase tracking-widest text-sm mb-4"><i className="fas fa-comment-dots mr-2"></i>Key Phrases</h4>
                                        <ul className="space-y-3 font-mono text-sm md:text-base text-zinc-300">
                                            <li><span className="text-pink-400 font-bold">➜</span> I'm (not) into...</li>
                                            <li><span className="text-pink-400 font-bold">➜</span> It makes me feel...</li>
                                            <li><span className="text-pink-400 font-bold">➜</span> ... is good music for...</li>
                                            <li><span className="text-pink-400 font-bold">➜</span> My taste in music is/will...</li>
                                            <li><span className="text-pink-400 font-bold">➜</span> It sounds (like)...</li>
                                        </ul>
                                    </div>
                                    
                                    <div className="mt-8 text-right">
                                        <button 
                                            onClick={nextStage}
                                            className="text-zinc-400 hover:text-white transition-colors uppercase tracking-widest text-sm font-bold"
                                        >
                                            Next: Guess the Artist &rarr;
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 3) {
                return (
                    <div className="min-h-screen p-6 md:p-12 pb-24 flex items-center justify-center">
                        <div className="max-w-6xl mx-auto w-full fade-in text-center">
                            <header className="mb-12">
                                <h4 className="text-pink-500 font-bold tracking-[0.2em] uppercase mb-2">Phase 3: Music Trends</h4>
                                <h2 className="text-4xl md:text-5xl font-display font-black text-white">Who are they?</h2>
                                <p className="text-zinc-400 mt-4 text-lg max-w-2xl mx-auto">
                                    We are about to read about some famous musicians in our Student Book. Read the clues below and <strong className="text-white">scratch off the cards</strong> to reveal who they are!
                                </p>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 slide-up delay-1">
                                {artistsData.map((artist) => (
                                    <div key={artist.id} className="flex flex-col items-center">
                                        <div className="bg-zinc-800/50 p-6 rounded-xl border border-zinc-700 w-full mb-6 min-h-[140px] flex items-center justify-center shadow-lg">
                                            <p className="text-white font-medium text-base md:text-lg leading-relaxed">"{artist.clue}"</p>
                                        </div>
                                        <ScratchCard artist={artist} />
                                    </div>
                                ))}
                            </div>

                            <div className="mt-16 text-center slide-up delay-2">
                                <button 
                                    onClick={nextStage}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-12 py-4 rounded-full font-bold text-lg shadow-[0_0_20px_rgba(79,70,229,0.5)] transition-all transform hover:scale-105"
                                >
                                    Continue to Reading Task <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 4) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                        {/* Space background effect */}
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900/20 via-[#09090b] to-[#09090b] z-0"></div>
                        
                        <div className="max-w-4xl mx-auto z-10 fade-in">
                            <div className="mb-10 relative inline-block">
                                {/* Vinyl Record Visual */}
                                <div className="w-48 h-48 md:w-64 md:h-64 rounded-full bg-zinc-900 border-[10px] border-zinc-800 shadow-2xl flex items-center justify-center spin mx-auto relative overflow-hidden">
                                    {/* Record Grooves */}
                                    <div className="absolute inset-0 rounded-full border border-zinc-700/50 m-4"></div>
                                    <div className="absolute inset-0 rounded-full border border-zinc-700/50 m-8"></div>
                                    <div className="absolute inset-0 rounded-full border border-zinc-700/50 m-12"></div>
                                    {/* Gold Center Label */}
                                    <div className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-600 flex items-center justify-center">
                                        <div className="w-2 h-2 bg-black rounded-full"></div>
                                    </div>
                                </div>
                            </div>

                            <h3 className="text-pink-500 font-bold tracking-[0.2em] uppercase mb-4 slide-up">Unit 1 Reading: Page 7</h3>
                            <h2 className="font-display text-4xl md:text-6xl font-black mb-8 text-white slide-up delay-1 leading-tight">
                                How does music <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600">connect us?</span>
                            </h2>
                            
                            <div className="bg-zinc-900/80 p-6 md:p-8 rounded-2xl border border-zinc-800 text-left slide-up delay-2 mb-10 shadow-xl max-w-3xl mx-auto">
                                <p className="text-xl text-zinc-300 leading-relaxed mb-6">
                                    In 1977, NASA launched the Voyager 1 space probe. Inside, they placed a <strong className="text-yellow-400">Golden Record</strong> containing images, sounds, and music from Earth, hoping to teach intelligent alien life about our civilization.
                                </p>
                                <div className="bg-black/50 p-6 rounded-xl border-l-4 border-yellow-500">
                                    <h4 className="text-yellow-500 font-bold uppercase tracking-widest text-sm mb-2">Think & Discuss:</h4>
                                    <p className="text-white text-lg">If you could choose <strong className="text-pink-400">three tracks</strong> to add to a new Golden Record today, what would you include and why? What do those tracks say about human emotion?</p>
                                </div>
                            </div>

                            <button 
                                onClick={() => setStage(0)}
                                className="text-zinc-500 hover:text-white transition-colors border border-zinc-700 hover:border-zinc-500 rounded-full px-8 py-3 text-sm font-bold tracking-widest uppercase slide-up delay-3"
                            >
                                Open Student Book Page 7
                            </button>
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
