<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Inter:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #09090b; /* Zinc 950 */
            color: white; 
            overflow-x: hidden;
        }
        
        h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; }

        .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Dynamic Equalizer Background */
        .equalizer-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        
        .bar {
            width: 4%;
            background: linear-gradient(to top, #8b5cf6, #ec4899);
            border-radius: 4px 4px 0 0;
            animation: bounce 1.5s infinite ease-in-out alternate;
        }
        
        .bar:nth-child(odd) { animation-duration: 1.2s; background: linear-gradient(to top, #3b82f6, #8b5cf6); }
        .bar:nth-child(3n) { animation-duration: 1.8s; background: linear-gradient(to top, #06b6d4, #3b82f6); }
        .bar:nth-child(1) { height: 40%; } .bar:nth-child(2) { height: 80%; }
        .bar:nth-child(3) { height: 60%; } .bar:nth-child(4) { height: 100%; }
        .bar:nth-child(5) { height: 30%; } .bar:nth-child(6) { height: 70%; }
        .bar:nth-child(7) { height: 50%; } .bar:nth-child(8) { height: 90%; }
        .bar:nth-child(9) { height: 40%; } .bar:nth-child(10) { height: 80%; }
        
        @keyframes bounce {
            0% { transform: scaleY(0.3); transform-origin: bottom; }
            100% { transform: scaleY(1); transform-origin: bottom; }
        }

        /* Vinyl Record Spin */
        .spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        /* Riddle Gate */
        .riddle-card {
            background:
                radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.16), transparent 34%),
                radial-gradient(circle at 85% 75%, rgba(59, 130, 246, 0.14), transparent 36%),
                rgba(24, 24, 27, 0.88);
            backdrop-filter: blur(18px);
        }

        .riddle-orbit {
            animation: riddleOrbit 12s linear infinite;
        }

        .riddle-note {
            animation: riddleFloat 2.8s ease-in-out infinite;
        }

        .riddle-shake {
            animation: riddleShake 0.38s ease-in-out;
        }

        @keyframes riddleOrbit {
            to { transform: rotate(360deg); }
        }

        @keyframes riddleFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes riddleShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .riddle-orbit,
            .riddle-note,
            .riddle-shake {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="equalizer-bg">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>

    <div id="root" class="relative z-10 min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ScratchCard = ({ artist }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [revealed, setRevealed] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                // Draw the initial scratch-off layer
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#4c1d95'); // Violet
                gradient.addColorStop(1, '#db2777'); // Pink
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Add text pattern over the cover
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.font = 'bold 24px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText('SCRATCH ME', canvas.width / 2, canvas.height / 2 + 8);
            }, []);

            const startDrawing = (e) => {
                setIsDrawing(true);
                scratch(e);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const scratch = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                
                // Support both touch and mouse
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                // Scale coordinates relative to CSS size vs internal Canvas resolution
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                // Erase the layer
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 35, 0, Math.PI * 2);
                ctx.fill();
            };

            return (
                <div className="relative w-full max-w-sm h-80 mx-auto rounded-2xl overflow-hidden shadow-[0_0_20px_rgba(219,39,119,0.3)] border border-zinc-700">
                    {/* Hidden Content Underneath */}
                    <div className="absolute inset-0 bg-black flex flex-col items-center justify-center p-4 text-center">
                        <img 
                            src={artist.imageUrl} 
                            alt={artist.name}
                            onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/200x200/27272a/ec4899?text=${artist.name.charAt(0)}` }}
                            className="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover mb-3 border-4 border-violet-500 shadow-[0_0_25px_rgba(139,92,246,0.6)] bg-zinc-800"
                        />
                        <h3 className="text-xl md:text-2xl font-display font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-violet-400 mb-1">{artist.name}</h3>
                        <p className="text-xs text-zinc-300 font-medium leading-snug">{artist.fact}</p>
                    </div>
                    
                    {/* Scratchable Canvas Layer */}
                    <canvas 
                        ref={canvasRef}
                        width={400}
                        height={320}
                        className={`absolute inset-0 w-full h-full cursor-crosshair transition-opacity duration-1000 ${revealed ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                        onMouseDown={startDrawing}
                        onMouseUp={stopDrawing}
                        onMouseLeave={stopDrawing}
                        onMouseMove={scratch}
                        onTouchStart={startDrawing}
                        onTouchEnd={stopDrawing}
                        onTouchMove={scratch}
                    />
                    
                    {/* Auto-Reveal Fallback Button */}
                    {!revealed && (
                        <button 
                            onClick={() => setRevealed(true)}
                            className="absolute bottom-3 right-3 bg-zinc-900/80 text-pink-400 font-bold text-xs px-4 py-2 rounded-full hover:bg-zinc-800 border border-pink-500/30 backdrop-blur-sm transition"
                        >
                            Reveal Name
                        </button>
                    )}
                </div>
            );
        };

        const artistsData = [
            { id: 1, clue: "In 2018, over two million fans attended her live concerts in the USA alone.", name: "Taylor Swift", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b1/Taylor_Swift_at_the_2023_MTV_Video_Music_Awards_%283%29.png", fact: "Her touring success appears on Student Book page 8.", connection: "Live concerts, touring and the changing music industry.", bonus: false },
            { id: 2, clue: "He made a staggering $432 million from music tours worldwide in a single year.", name: "Ed Sheeran", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/c/c1/Ed_Sheeran-6886_%28cropped%29.jpg", fact: "His touring income appears on Student Book page 8.", connection: "Live music, touring income and future music trends.", bonus: false },
            { id: 3, clue: "His 5th Symphony was sent into outer space on the Voyager 1 probe in 1977.", name: "Beethoven", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Beethoven.jpg", fact: "His music appears in the Golden Record reading on Student Book page 7.", connection: "The Golden Record and music as a message from Earth.", bonus: false },
            { id: 4, clue: "His 1950s rock song 'Johnny B. Goode' was included on the Golden Record sent into space.", name: "Chuck Berry", imageUrl: "https://hips.hearstapps.com/hmg-prod/images/gettyimages-74254327.jpg", fact: "His song appears in the Golden Record reading on Student Book page 7.", connection: "The Golden Record, musical genres and cultural representation.", bonus: false },
            { id: 5, clue: "A child prodigy who started composing at age five, he became one of the most famous classical musicians.", name: "W. A. Mozart", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Wolfgang-amadeus-mozart_1.jpg", fact: "A bonus connection to classical music and emotional responses.", connection: "Classical music and the effects of music on mood.", bonus: true },
            { id: 6, clue: "She recorded her Grammy-winning debut album in her brother's small bedroom.", name: "Billie Eilish", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/f/fa/Billie_Eilish_2019_by_Glenn_Francis_%28cropped%29_2.jpg", fact: "A bonus connection to bedroom pop and modern music technology.", connection: "Digital production and new ways of creating music.", bonus: true }
        ];

        const quizData = [
            {
                id: 1,
                q: "In music, an 'earworm' is a song:",
                options: [
                    { text: "with memorable lyrics.", isCorrect: false },
                    { text: "that repeats itself in your head.", isCorrect: true },
                    { text: "with a fast tempo.", isCorrect: false }
                ],
                fact: "An earworm is a catchy piece of music that continually repeats through a person's mind."
            },
            {
                id: 2,
                q: "The maximum number of tracks a music app can have is:",
                options: [
                    { text: "30 million.", isCorrect: true },
                    { text: "13 million.", isCorrect: false },
                    { text: "3 million.", isCorrect: false }
                ],
                fact: "Many major streaming apps initially capped at around 30 million tracks (though they have grown since!)."
            },
            {
                id: 3,
                q: "Music influences our circadian rhythm, which is:",
                options: [
                    { text: "how we move.", isCorrect: false },
                    { text: "how we feel.", isCorrect: false },
                    { text: "the times when we sleep and eat.", isCorrect: true }
                ],
                fact: "Our circadian rhythms are our physical, mental, and behavioral changes that follow a 24-hour cycle."
            },
            {
                id: 4,
                q: "Shopping malls and stores use playlists or background music to:",
                options: [
                    { text: "entertain us.", isCorrect: false },
                    { text: "make us stay longer.", isCorrect: true },
                    { text: "encourage us to shop quickly.", isCorrect: false }
                ],
                fact: "Slow-tempo music makes shoppers walk slower, meaning they spend more time and money in the store!"
            },
            {
                id: 5,
                q: "Research suggests that we associate notes with a higher pitch with:",
                options: [
                    { text: "bitter flavors.", isCorrect: false },
                    { text: "salty flavors.", isCorrect: false },
                    { text: "sweet flavors.", isCorrect: true }
                ],
                fact: "Cross-modal perception shows our brains link high pitch to sweetness, and low pitch to bitterness."
            },
            {
                id: 6,
                q: "The genres and melodies we like throughout our life are usually from:",
                options: [
                    { text: "our childhood.", isCorrect: false },
                    { text: "our teenage years.", isCorrect: true },
                    { text: "our adult years.", isCorrect: false }
                ],
                fact: "Musical nostalgia is strongest for the music we listened to between ages 13 and 16."
            }
        ];

        const RiddleGate = ({ onSolve }) => {
            const [answer, setAnswer] = useState('');
            const [message, setMessage] = useState('');
            const [isUnlocking, setIsUnlocking] = useState(false);
            const [shakeKey, setShakeKey] = useState(0);
            const inputRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const checkAnswer = (event) => {
                event.preventDefault();
                const normalized = answer
                    .trim()
                    .toLowerCase()
                    .replace(/[^a-z\s]/g, '')
                    .replace(/^(a|an|the)\s+/, '')
                    .replace(/\s+/g, ' ');

                if (!normalized) {
                    setMessage('Enter your answer first.');
                    setShakeKey((key) => key + 1);
                    return;
                }

                if (['music', 'melody', 'sound'].includes(normalized)) {
                    setMessage('You found the key. Opening the experience...');
                    setIsUnlocking(true);
                    window.setTimeout(onSolve, 700);
                } else {
                    setMessage('Not quite. Think of something you can hear but never hold.');
                    setShakeKey((key) => key + 1);
                }
            };

            return (
                <main className={`min-h-screen flex items-center justify-center px-5 py-10 transition-opacity duration-700 ${isUnlocking ? 'opacity-0' : 'opacity-100'}`}>
                    <section className="riddle-card relative w-full max-w-3xl overflow-hidden rounded-[2rem] border border-violet-500/30 px-6 py-10 text-center shadow-[0_0_70px_rgba(139,92,246,0.2)] md:px-14 md:py-14" aria-labelledby="riddle-title">
                        <div className="pointer-events-none absolute -right-24 -top-24 h-64 w-64 rounded-full border border-pink-500/20 riddle-orbit">
                            <span className="absolute bottom-8 left-8 h-3 w-3 rounded-full bg-pink-400 shadow-[0_0_18px_rgba(244,114,182,0.9)]"></span>
                        </div>

                        <div className="relative z-10">
                            <div className="riddle-note mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full border border-pink-400/30 bg-gradient-to-br from-violet-600/30 to-pink-600/30 text-4xl text-pink-300 shadow-[0_0_35px_rgba(236,72,153,0.25)]" aria-hidden="true">
                                <i className="fas fa-question"></i>
                            </div>
                            <p className="mb-3 text-xs font-bold uppercase tracking-[0.35em] text-violet-300">A mystery before the lesson</p>
                            <h1 id="riddle-title" className="font-display text-4xl font-black text-white md:text-6xl">Can you unlock the unit?</h1>

                            <div className="mx-auto my-8 max-w-2xl space-y-4 text-lg leading-relaxed text-zinc-200 md:text-xl">
                                <p>I have no physical weight, shape, or color, yet I can instantly change the atmosphere of a room.</p>
                                <p>I can bring back forgotten memories without saying a word, make your heart beat faster without moving a muscle, and create deep connection between strangers without them speaking.</p>
                                <p>You can create me, follow my tempo, or let me fade into silence, but you can never physically hold me.</p>
                                <p className="font-display text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-violet-400">What am I?</p>
                            </div>

                            <form key={shakeKey} onSubmit={checkAnswer} className={message && !isUnlocking ? 'riddle-shake' : ''}>
                                <label htmlFor="riddle-answer" className="sr-only">Your answer</label>
                                <div className="mx-auto flex max-w-xl flex-col gap-3 sm:flex-row">
                                    <input
                                        id="riddle-answer"
                                        ref={inputRef}
                                        type="text"
                                        value={answer}
                                        onChange={(event) => {
                                            setAnswer(event.target.value);
                                            if (message) setMessage('');
                                        }}
                                        disabled={isUnlocking}
                                        autoComplete="off"
                                        placeholder="Type your answer..."
                                        className="min-w-0 flex-1 rounded-full border border-zinc-600 bg-black/60 px-6 py-4 text-center text-lg text-white outline-none transition placeholder:text-zinc-600 focus:border-pink-400 focus:ring-4 focus:ring-pink-500/20 sm:text-left"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isUnlocking}
                                        className="rounded-full bg-gradient-to-r from-violet-600 to-pink-600 px-7 py-4 font-display font-bold uppercase tracking-wider text-white shadow-[0_0_25px_rgba(219,39,119,0.3)] transition hover:-translate-y-0.5 hover:shadow-[0_0_35px_rgba(219,39,119,0.5)] focus:outline-none focus:ring-4 focus:ring-violet-400/40 disabled:cursor-wait disabled:opacity-70"
                                    >
                                        {isUnlocking ? 'Unlocking...' : 'Unlock'}
                                    </button>
                                </div>
                            </form>

                            <p className={`mt-4 min-h-[1.5rem] text-sm font-semibold ${isUnlocking ? 'text-emerald-300' : 'text-pink-300'}`} role="status" aria-live="polite">
                                {message}
                            </p>
                        </div>
                    </section>
                </main>
            );
        };

        const ProgressDock = ({ stage, onBack, onSkip }) => {
            const labels = ['Intro', 'Predict', 'Watch', 'Read & Decide', 'Reveal', 'Reflect'];
            return (
                <div className="sticky top-3 z-40 mb-8 max-w-6xl mx-auto rounded-2xl border border-zinc-700 bg-zinc-950/90 px-3 py-3 shadow-xl backdrop-blur-xl">
                    <div className="flex items-center justify-between gap-3">
                        <button onClick={onBack} disabled={stage === 0} className="rounded-full border border-zinc-700 px-3 py-2 text-xs font-bold text-zinc-300 disabled:opacity-30">← Back</button>
                        <div className="flex flex-1 items-center justify-center gap-1">
                            {labels.map((label, index) => (
                                <div key={label} className="flex items-center">
                                    <span className={'flex h-8 w-8 items-center justify-center rounded-full text-xs font-black ' + (index === stage ? 'bg-gradient-to-r from-violet-600 to-pink-600 text-white' : index < stage ? 'bg-emerald-900/70 text-emerald-300' : 'bg-zinc-800 text-zinc-500')} title={label}>
                                        {index < stage ? '✓' : index + 1}
                                    </span>
                                    {index < labels.length - 1 && <span className={'mx-1 hidden h-px w-5 sm:block ' + (index < stage ? 'bg-emerald-600' : 'bg-zinc-700')}></span>}
                                </div>
                            ))}
                        </div>
                        <button onClick={onSkip} disabled={stage === 5} className="rounded-full border border-zinc-700 px-3 py-2 text-xs font-bold text-zinc-400 disabled:opacity-30">Teacher skip →</button>
                    </div>
                    <p className="mt-2 text-center text-[11px] font-bold uppercase tracking-[0.18em] text-zinc-500">{stage + 1} of 6 · {labels[stage]}</p>
                </div>
            );
        };

        const EmotionLab = ({ onNext, onBack, onSkip }) => {
            const [evidenceA, setEvidenceA] = useState('');
            const [evidenceB, setEvidenceB] = useState('');
            const [position, setPosition] = useState('Both interact');
            const [reason, setReason] = useState('');
            const positions = [
                ['The sound matters more','🎼'],
                ['The listener matters more','🧠'],
                ['Both interact','⚖️']
            ];
            return (
                <div className="min-h-screen p-4 md:p-8 pb-24">
                    <ProgressDock stage={3} onBack={onBack} onSkip={onSkip} />
                    <div className="max-w-6xl mx-auto fade-in">
                        <header className="text-center mb-8">
                            <p className="text-pink-400 font-bold tracking-[0.25em] uppercase text-sm">Discover More · Student Book page 6</p>
                            <h2 className="text-5xl md:text-6xl font-display font-black mt-3">Two Views, <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-400">One Question</span></h2>
                            <p className="text-zinc-300 text-lg max-w-3xl mx-auto mt-4">Read two short B2 texts. Compare their evidence and decide what you think.</p>
                        </header>

                        <section className="mb-6 rounded-3xl border border-violet-500/40 bg-gradient-to-r from-violet-950/80 to-pink-950/60 p-6">
                            <h3 className="text-2xl font-display font-black">📖 Eight-minute evidence challenge</h3>
                            <p className="mt-2 text-lg"><strong className="text-pink-300">Big question:</strong> Why do different types of music influence how we feel?</p>
                            <ol className="mt-4 grid gap-3 text-zinc-300 md:grid-cols-4">
                                <li className="rounded-2xl bg-black/30 p-4"><strong className="text-cyan-300">1 · Read</strong><br />Start with one document.</li>
                                <li className="rounded-2xl bg-black/30 p-4"><strong className="text-cyan-300">2 · Explain</strong><br />Tell your partner its main idea.</li>
                                <li className="rounded-2xl bg-black/30 p-4"><strong className="text-cyan-300">3 · Compare</strong><br />Read the other view.</li>
                                <li className="rounded-2xl bg-black/30 p-4"><strong className="text-cyan-300">4 · Decide</strong><br />Form a supported opinion.</li>
                            </ol>
                        </section>

                        <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
                            <article className="rounded-3xl border border-cyan-500/40 bg-gradient-to-br from-cyan-950/50 via-zinc-900 to-zinc-950 p-6 md:p-7">
                                <div className="flex items-center justify-between gap-3">
                                    <p className="text-xs font-black uppercase tracking-[0.2em] text-cyan-300">Document A · The music-centred view</p>
                                    <span className="rounded-full bg-cyan-950 px-3 py-1 text-xs font-bold text-cyan-200">about 150 words</span>
                                </div>
                                <h3 className="mt-3 text-3xl font-display font-black">The Sound Shapes the Feeling</h3>
                                <div className="mt-5 space-y-4 text-[17px] leading-8 text-zinc-200">
                                    <p>Music has physical features that can influence how the body and brain respond. Tempo is one example. Fast, regular beats may increase alertness and make movement feel easier, while slower music can support calm breathing. Pitch and volume also matter. High or rising sounds are often heard as bright or exciting, whereas low, sudden or dissonant sounds may create tension. Film composers use these patterns to guide an audience before a character even speaks.</p>
                                    <p>This does not mean that a song controls everybody in exactly the same way. However, musical structure gives listeners emotional signals. A steady rhythm can support exercise, and predictable, gentle music may help concentration or relaxation. From this perspective, music influences feelings mainly because tempo, rhythm, pitch and intensity affect attention and energy. The sound itself leads the emotional response, even if individual reactions are not identical.</p>
                                </div>
                                <div className="mt-5 rounded-2xl border border-cyan-700/50 bg-black/30 p-4">
                                    <p className="text-sm font-bold text-cyan-300">Central claim</p>
                                    <p className="mt-1 text-sm text-zinc-300">The structure of music sends emotional signals that can influence attention, energy and mood.</p>
                                </div>
                            </article>

                            <article className="rounded-3xl border border-pink-500/40 bg-gradient-to-br from-pink-950/50 via-zinc-900 to-zinc-950 p-6 md:p-7">
                                <div className="flex items-center justify-between gap-3">
                                    <p className="text-xs font-black uppercase tracking-[0.2em] text-pink-300">Document B · The listener-centred view</p>
                                    <span className="rounded-full bg-pink-950 px-3 py-1 text-xs font-bold text-pink-200">about 150 words</span>
                                </div>
                                <h3 className="mt-3 text-3xl font-display font-black">The Listener Creates the Meaning</h3>
                                <div className="mt-5 space-y-4 text-[17px] leading-8 text-zinc-200">
                                    <p>Music does not act like an emotional command. Listeners bring memories, cultural knowledge and personal preferences to every song. A slow song may feel peaceful to one person but deeply sad to another. An energetic track may motivate someone during exercise, yet annoy a listener who dislikes that style. Lyrics can also change a reaction because people connect words with particular experiences.</p>
                                    <p>Context matters as well. The same song may feel exciting at a concert, distracting during homework and comforting when heard years later. Familiar music can produce nostalgia because it is connected with people, places or important moments. From this perspective, emotion is created through an interaction between sound and the listener’s life. Musical features matter, but they do not carry one fixed message. People interpret music, so background, memory and situation may be as influential as tempo or pitch.</p>
                                </div>
                                <div className="mt-5 rounded-2xl border border-pink-700/50 bg-black/30 p-4">
                                    <p className="text-sm font-bold text-pink-300">Central claim</p>
                                    <p className="mt-1 text-sm text-zinc-300">A listener’s memories, culture, preferences and situation shape the emotional meaning of music.</p>
                                </div>
                            </article>
                        </div>

                        <details className="mt-6 rounded-2xl border border-zinc-700 bg-zinc-900/80 p-5">
                            <summary className="cursor-pointer font-bold text-violet-300">Vocabulary support</summary>
                            <div className="mt-4 grid gap-3 text-sm text-zinc-300 sm:grid-cols-2 lg:grid-cols-4">
                                <p><strong className="text-white">alertness:</strong> being awake and ready to react</p>
                                <p><strong className="text-white">dissonant:</strong> containing sounds that create tension</p>
                                <p><strong className="text-white">nostalgia:</strong> emotion connected with memories of the past</p>
                                <p><strong className="text-white">interpret:</strong> understand something in a particular way</p>
                            </div>
                        </details>

                        <section className="mt-6 rounded-3xl border border-zinc-700 bg-zinc-900/80 p-6">
                            <p className="text-violet-300 font-bold uppercase tracking-widest text-xs">Compare the evidence</p>
                            <div className="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
                                <label className="text-sm text-zinc-400">One convincing idea from Document A
                                    <textarea value={evidenceA} onChange={(e) => setEvidenceA(e.target.value)} placeholder="Musical features may..." className="mt-2 min-h-[90px] w-full rounded-2xl border border-cyan-800 bg-black/40 p-4 text-white" />
                                </label>
                                <label className="text-sm text-zinc-400">One convincing idea from Document B
                                    <textarea value={evidenceB} onChange={(e) => setEvidenceB(e.target.value)} placeholder="Listeners may react differently because..." className="mt-2 min-h-[90px] w-full rounded-2xl border border-pink-800 bg-black/40 p-4 text-white" />
                                </label>
                            </div>
                        </section>

                        <section className="mt-6 rounded-3xl border border-zinc-700 bg-zinc-900/80 p-6">
                            <p className="text-emerald-300 font-bold uppercase tracking-widest text-xs">Take a position</p>
                            <h3 className="mt-2 text-2xl font-display font-black">Which explanation is more convincing?</h3>
                            <div className="mt-4 grid gap-3 md:grid-cols-3">
                                {positions.map((item) => (
                                    <button key={item[0]} onClick={() => setPosition(item[0])} className={'rounded-2xl border p-4 text-left transition ' + (position === item[0] ? 'border-emerald-300 bg-emerald-950/70 text-white' : 'border-zinc-700 bg-black/30 text-zinc-300 hover:border-zinc-500')}>
                                        <span className="text-2xl">{item[1]}</span>
                                        <span className="mt-2 block font-bold">{item[0]}</span>
                                    </button>
                                ))}
                            </div>
                            <label className="mt-5 block text-sm text-zinc-400">Explain your position with evidence from the texts or your experience.
                                <textarea value={reason} onChange={(e) => setReason(e.target.value)} placeholder="I think... because Document... explains that..." className="mt-2 min-h-[100px] w-full rounded-2xl border border-zinc-700 bg-black/40 p-4 text-white" />
                            </label>
                            <div className="mt-5 rounded-2xl border border-emerald-500/30 bg-gradient-to-r from-emerald-950/60 to-cyan-950/50 p-5 text-lg">
                                <p className="text-xs font-black uppercase tracking-widest text-emerald-300">Your developing opinion</p>
                                <p className="mt-2"><strong>{position}.</strong> {reason || 'Add a reason and refer to at least one idea from the documents.'}</p>
                            </div>
                            <p className="mt-4 text-sm text-zinc-500">These are balanced classroom texts written for this lesson. They summarise common perspectives and do not claim that every listener responds in the same way.</p>
                        </section>

                        <div className="mt-8 text-center"><button onClick={onNext} className="bg-pink-600 hover:bg-pink-500 text-white px-10 py-4 rounded-full font-bold text-lg">Next: Artist Scratch Cards →</button></div>
                    </div>
                </div>
            );
        };

        const ArtistStage = ({ onNext, onBack, onSkip }) => {
            const core = artistsData.filter((artist) => !artist.bonus);
            const bonus = artistsData.filter((artist) => artist.bonus);
            const card = (artist) => (
                <div key={artist.id} className="flex flex-col items-center">
                    <div className="bg-zinc-800/50 p-5 rounded-xl border border-zinc-700 w-full mb-5 min-h-[125px] flex items-center justify-center"><p>"{artist.clue}"</p></div>
                    <ScratchCard artist={artist} />
                    <div className="mt-4 w-full rounded-xl border border-zinc-700 bg-zinc-900/70 p-4 text-left">
                        <p className="text-xs font-bold uppercase tracking-widest text-pink-400">After the reveal</p>
                        <p className="mt-2 text-sm text-white">How is this artist connected with Unit 1?</p>
                        <details className="mt-3 text-sm text-zinc-400"><summary className="cursor-pointer font-bold text-violet-300">Check the connection</summary><p className="mt-2">{artist.connection}</p></details>
                    </div>
                </div>
            );
            return (
                <div className="min-h-screen p-4 md:p-8 pb-24">
                    <ProgressDock stage={4} onBack={onBack} onSkip={onSkip} />
                    <div className="max-w-6xl mx-auto fade-in text-center">
                        <header className="mb-10">
                            <h4 className="text-pink-500 font-bold tracking-[0.2em] uppercase">Student Book pages 7–8</h4>
                            <h2 className="text-4xl md:text-5xl font-display font-black mt-2">Who are they?</h2>
                            <p className="text-zinc-400 mt-4 text-lg">Read the clue, agree on a prediction, scratch to reveal, and explain the Unit 1 connection.</p>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">{core.map(card)}</div>
                        <details className="mt-12 rounded-2xl border border-zinc-700 bg-zinc-900/60 p-6 text-left">
                            <summary className="cursor-pointer text-center text-lg font-bold text-violet-300">Bonus artists if time allows</summary>
                            <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8 text-center">{bonus.map(card)}</div>
                        </details>
                        <div className="mt-12"><button onClick={onNext} className="bg-indigo-600 hover:bg-indigo-500 text-white px-12 py-4 rounded-full font-bold text-lg">Finish with Evidence →</button></div>
                    </div>
                </div>
            );
        };

        const ReflectionStage = ({ onBack, onRestart }) => {
            const [claim, setClaim] = useState('');
            const [evidence, setEvidence] = useState('');
            const [different, setDifferent] = useState('');
            return (
                <div className="min-h-screen p-4 md:p-8 pb-24">
                    <ProgressDock stage={5} onBack={onBack} onSkip={() => {}} />
                    <div className="max-w-4xl mx-auto fade-in rounded-3xl border border-violet-500/40 bg-gradient-to-br from-violet-950/80 via-zinc-950 to-pink-950/70 p-7 md:p-10">
                        <p className="text-center text-pink-400 font-bold uppercase tracking-[0.25em] text-sm">Exit Ticket · Final Mix</p>
                        <h2 className="mt-3 text-center text-4xl font-display font-black">Claim + Evidence</h2>
                        <div className="mt-8 space-y-5">
                            <label className="block text-sm font-bold text-zinc-300">One way music affects people is...<textarea value={claim} onChange={(e) => setClaim(e.target.value)} className="mt-2 min-h-[85px] w-full rounded-2xl border border-zinc-700 bg-black/40 p-4 text-white" /></label>
                            <label className="block text-sm font-bold text-zinc-300">One piece of evidence or one example from today is...<textarea value={evidence} onChange={(e) => setEvidence(e.target.value)} className="mt-2 min-h-[85px] w-full rounded-2xl border border-zinc-700 bg-black/40 p-4 text-white" /></label>
                            <label className="block text-sm font-bold text-zinc-300">Optional: However, the same music may affect people differently because...<textarea value={different} onChange={(e) => setDifferent(e.target.value)} className="mt-2 min-h-[70px] w-full rounded-2xl border border-zinc-700 bg-black/40 p-4 text-white" /></label>
                        </div>
                        <p className="mt-6 rounded-2xl border border-zinc-700 bg-black/30 p-5 text-zinc-300">A strong response contains a clear idea and specific support. Opinion is the opening act; evidence is the headline performer.</p>
                        <div className="mt-8 text-center"><button onClick={onRestart} className="rounded-full bg-gradient-to-r from-violet-600 to-pink-600 px-10 py-4 font-bold">Start Again</button></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [stage, setStage] = useState(0);
            const [answers, setAnswers] = useState({});
            const [predictionsLocked, setPredictionsLocked] = useState(false);
            const [factflixChecked, setFactflixChecked] = useState(false);

            const goTo = (next) => { setStage(Math.max(0, Math.min(5, next))); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            const nextStage = () => goTo(stage + 1);
            const previousStage = () => goTo(stage - 1);
            const skipStage = () => goTo(stage + 1);
            const handleSelect = (id, index) => { if (!predictionsLocked) setAnswers(Object.assign({}, answers, { [id]: index })); };
            const lockPredictions = () => { setPredictionsLocked(true); goTo(2); };
            const restart = () => { setStage(0); setAnswers({}); setPredictionsLocked(false); setFactflixChecked(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

            if (!isUnlocked) return <RiddleGate onSolve={() => setIsUnlocked(true)} />;

            if (stage === 0) return (
                <div className="min-h-screen p-4 md:p-8">
                    <ProgressDock stage={0} onBack={previousStage} onSkip={skipStage} />
                    <div className="min-h-[75vh] flex items-center justify-center text-center">
                        <div className="max-w-4xl fade-in">
                            <i className="fas fa-headphones-alt text-6xl text-violet-400"></i>
                            <h3 className="text-sm font-bold tracking-[0.3em] uppercase text-violet-400 mt-5">Unit 1 Introduction</h3>
                            <h1 className="font-display text-6xl md:text-8xl font-black my-6">How is <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">MUSIC</span><br/>a part of our lives?</h1>
                            <p className="text-2xl text-zinc-400 mb-10">Test your instincts, listen for evidence, and see which predictions survive Factflix.</p>
                            <button onClick={nextStage} className="px-10 py-5 font-bold text-white bg-zinc-900 border-2 border-violet-500 rounded-full hover:bg-violet-600">Make Predictions →</button>
                        </div>
                    </div>
                </div>
            );

            if (stage === 1) return (
                <div className="min-h-screen p-4 md:p-8 pb-24">
                    <ProgressDock stage={1} onBack={previousStage} onSkip={skipStage} />
                    <div className="max-w-5xl mx-auto fade-in">
                        <header className="mb-8 border-b border-zinc-800 pb-6">
                            <p className="text-violet-300 font-bold uppercase tracking-widest text-xs">Prediction round</p>
                            <h2 className="text-4xl font-display font-black mt-2">The Music in Our Lives</h2>
                            <p className="text-zinc-400 mt-2 text-lg">Work in pairs. Choose answers, but do not check them yet—the video is your evidence.</p>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            {quizData.map((q) => (
                                <div key={q.id} className="bg-zinc-900/80 border border-zinc-800 p-5 rounded-2xl">
                                    <p className="text-lg font-medium mb-4"><span className="text-pink-500 font-black mr-2">{q.id}.</span>{q.q}</p>
                                    <div className="space-y-2">{q.options.map((opt, index) => <button key={index} onClick={() => handleSelect(q.id, index)} className={'w-full text-left p-3 rounded-xl border ' + (answers[q.id] === index ? 'bg-violet-900/60 border-violet-400' : 'bg-zinc-800/50 border-zinc-700')}><span className="inline-block w-6 opacity-50">{['a','b','c'][index]})</span>{opt.text}</button>)}</div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-10 text-center">
                            <button onClick={lockPredictions} disabled={Object.keys(answers).length < quizData.length} className={'px-10 py-4 rounded-full font-bold text-lg ' + (Object.keys(answers).length === quizData.length ? 'bg-pink-600 text-white' : 'bg-zinc-800 text-zinc-500 cursor-not-allowed')}>Lock Predictions & Watch Factflix</button>
                            <p className="mt-3 text-sm text-zinc-500">Correct answers remain hidden until after the video.</p>
                        </div>
                    </div>
                </div>
            );

            if (stage === 2) return (
                <div className="min-h-screen p-4 md:p-8 pb-24">
                    <ProgressDock stage={2} onBack={previousStage} onSkip={skipStage} />
                    <div className="max-w-6xl mx-auto fade-in">
                        <header className="mb-8 text-center">
                            <p className="text-red-400 font-bold uppercase tracking-[0.25em] text-xs">Factflix viewing mission</p>
                            <h2 className="mt-2 text-4xl md:text-5xl font-display font-black">Listen for evidence</h2>
                            <p className="mx-auto mt-4 max-w-3xl text-zinc-300 text-lg">Your teacher will switch to the Factflix tab. Jot down an answer only when you hear evidence. The answers may not appear in question order.</p>
                        </header>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                            <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                                {quizData.map((q) => <div key={q.id} className="rounded-2xl border border-zinc-700 bg-zinc-900/80 p-4"><p className="text-xs font-black uppercase tracking-widest text-violet-300">Question {q.id}</p><p className="mt-2 text-sm">{q.q}</p><p className="mt-3 text-xs text-zinc-500">Prediction: <span className="text-zinc-300">{q.options[answers[q.id]] ? q.options[answers[q.id]].text : 'No answer'}</span></p></div>)}
                            </div>
                            <aside className="rounded-3xl border border-pink-500/30 bg-gradient-to-br from-pink-950/70 to-zinc-950 p-6">
                                <div className="text-5xl">📝</div><h3 className="mt-4 text-2xl font-display font-black">Note-taking rule</h3>
                                <p className="mt-3 text-zinc-300">Write keywords only when the video supplies evidence. Leave a question blank if you do not hear its answer.</p>
                                <div className="mt-5 rounded-2xl border border-zinc-700 bg-black/30 p-4"><p className="text-sm font-bold text-pink-300">Extra question</p><p className="mt-2 text-sm">How many hours does the average teenager listen to music each day?</p></div>
                            </aside>
                        </div>
                        {!factflixChecked ? <div className="mt-10 text-center"><button onClick={() => setFactflixChecked(true)} className="rounded-full bg-emerald-600 px-10 py-4 text-lg font-bold">We Have Watched — Check Predictions</button></div> :
                        <div className="mt-10">
                            <h3 className="text-center text-3xl font-display font-black">What did Factflix confirm?</h3>
                            <div className="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">{quizData.map((q) => { const correctIndex = q.options.findIndex((option) => option.isCorrect); const correct = answers[q.id] === correctIndex; return <div key={q.id} className={'rounded-2xl border p-5 ' + (correct ? 'border-emerald-500/50 bg-emerald-950/40' : 'border-amber-500/50 bg-amber-950/30')}><p className="font-bold">{correct ? '✓ Prediction confirmed' : '↻ Prediction revised'}</p><p className="mt-2 text-sm"><strong>Answer:</strong> {q.options[correctIndex].text}</p><p className="mt-2 text-xs text-zinc-400">{q.fact}</p></div>; })}</div>
                            <div className="mt-6 rounded-2xl border border-violet-500/30 bg-violet-950/30 p-5"><strong className="text-violet-200">Quick pair talk:</strong><p className="mt-2 text-zinc-300">Which answer surprised you? What impact does your music have on you?</p><p className="mt-3 text-sm text-zinc-500">“I’m into…” · “It makes me feel…” · “…is good music for…”</p></div>
                            <div className="mt-8 text-center"><button onClick={nextStage} className="rounded-full bg-indigo-600 px-10 py-4 text-lg font-bold">Next: Soundtrack Scientists →</button></div>
                        </div>}
                    </div>
                </div>
            );

            if (stage === 3) return <EmotionLab onNext={nextStage} onBack={previousStage} onSkip={skipStage} />;
            if (stage === 4) return <ArtistStage onNext={nextStage} onBack={previousStage} onSkip={skipStage} />;
            if (stage === 5) return <ReflectionStage onBack={previousStage} onRestart={restart} />;
            return null;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
